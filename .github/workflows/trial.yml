name: Trial
# Runs the evaluator's experience against a PUBLISHED release, exactly as an
# evaluator would:
#   bundle-windows : the offline bundle (odr-<tag>-windows-trial-bundle.zip) is
#                    unzipped and START_HERE.bat is run on a real Windows runner
#                    with NO GitHub token in the environment (nothing to download).
#   online-*       : try_odr.ps1 (Windows PowerShell 5.1) / try_odr.sh (Linux)
#                    download the release archive + golden set themselves.
# Triggered after a successful Release, or by hand for any tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to try (e.g. v0.4.0-alpha)"
        required: true
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  bundle-windows:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Download the offline bundle (the only network step)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:TAG -R "${{ github.repository }}" -p "odr-$env:TAG-windows-trial-bundle.zip*" -D "$env:RUNNER_TEMP"
          $exp = ((Get-Content "$env:RUNNER_TEMP\odr-$env:TAG-windows-trial-bundle.zip.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
          $act = (Get-FileHash "$env:RUNNER_TEMP\odr-$env:TAG-windows-trial-bundle.zip" -Algorithm SHA256).Hash.ToLower()
          if ($exp -ne $act) { throw "bundle sha256 mismatch" }
          Expand-Archive "$env:RUNNER_TEMP\odr-$env:TAG-windows-trial-bundle.zip" -DestinationPath "$env:RUNNER_TEMP\eval"
      - name: Double-click START_HERE.bat (offline, no token)
        shell: cmd
        env:
          ODR_NO_PAUSE: "1"
          GH_TOKEN: ""
          ODR_TOKEN: ""
        run: |
          cd /d "%RUNNER_TEMP%\eval\odr-%TAG%-windows-trial-bundle"
          call START_HERE.bat
          if errorlevel 1 exit /b 1
          powershell -NoProfile -Command "if (-not (Select-String -Path odr-trial-log.txt -SimpleMatch 'RESULT: 33 passed, 0 failed' -Quiet)) { Get-Content odr-trial-log.txt; exit 1 }"

  online:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: online-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Private releases: the scripts download with `gh` (GH_TOKEN) — same path as an invited reader.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
      - name: try_odr.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File docs/field/try_odr.ps1 -Dir "$env:RUNNER_TEMP\odr-trial" -Tag $env:TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: try_odr.sh (Linux)
        if: runner.os == 'Linux'
        run: bash docs/field/try_odr.sh "$RUNNER_TEMP/odr-trial" "$TAG"
