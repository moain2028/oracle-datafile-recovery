name: CI
on:
  push:
    branches: [main, "agent/**", "lead/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows first: it is the primary customer platform (YemenSoft).
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Charset tables up to date
        run: python3 tools/gen_charsets.py --check
      - name: THIRD_PARTY_LICENSES.txt up to date
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/gen_third_party.py --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      - name: Release build
        run: cargo build --release -p odr-cli --locked
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: odr-windows-x64
          path: target/release/odr.exe

  golden:
    # The real proof: every golden test against Oracle's own truth on three
    # versions (26ai, 21c, 11g, 18c, ar8). The sets live in this repository's private
    # Releases (rebuilt 2026-11-03 from lab/). Without this job the golden
    # tests skip silently and CI proves nothing about Oracle data.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Download golden sets (26ai, 21c, 11g, 18c, ar8) and verify SHA-256
        run: |
          mkdir -p g && cd g
          for t in golden-26ai-20261103 golden-21c-20261103 golden-11g-20261103 golden-18c-20261103 golden-ar8-20261103; do
            gh release download "$t" -R "${{ github.repository }}" -p '*.tar.gz' -p '*.sha256'
          done
          for s in *.tar.gz.sha256; do sha256sum -c "$s"; done
          for f in *.tar.gz; do tar -xzf "$f"; done
          for d in */; do (cd "$d" && sha256sum -c --quiet SHA256SUMS) && echo "$d SHA256SUMS ok"; done
      - name: Golden tests — 26ai + 21c (hold-out)
        run: |
          export ODR_GOLDEN=$PWD/g/20261103T003005Z ODR_GOLDEN_V2=$PWD/g/20261103T003005Z ODR_GOLDEN2=$PWD/g/20261103T023601Z
          cargo test --workspace --locked --release -- --test-threads=2
      - name: Golden tests — 11g (hold-out, non-CDB)
        run: |
          export ODR_GOLDEN=$PWD/g/20261103T003005Z ODR_GOLDEN2=$PWD/g/20261103T025745Z
          cargo test --locked --release -p odr-core --test golden_lab -- lab2_second_version_reads_like_oracle
          cargo test --locked --release -p odr-cli --test golden_cli -- scavenge_type_candidates_never_name_a_wrong_type lab2_lob_tables_match_oracle
      - name: Golden tests — 18c and 11g AR8MSWIN1256 (hold-out)
        run: |
          for r in 20261103T050936Z 20261103T044428Z; do
            export ODR_GOLDEN=$PWD/g/20261103T003005Z ODR_GOLDEN2=$PWD/g/$r
            cargo test --locked --release -p odr-core --test golden_lab -- lab2_second_version_reads_like_oracle
            cargo test --locked --release -p odr-cli --test golden_cli -- scavenge_type_candidates_never_name_a_wrong_type lab2_lob_tables_match_oracle
          done

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: |
          cd fuzz
          for t in decode_number classify_block data_block read_heap row_piece bootstrap bootstrap_columns kcvfh segment charset types value; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done
